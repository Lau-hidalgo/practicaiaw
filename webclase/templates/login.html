{% extends "base.html" %}

{% block page_title %}🔑 Iniciar Sesión{% endblock %}

{% block content %}
<div class="card">
    <h2>🔑 Iniciar Sesión</h2>
    
    {% if error %}
    <div class="mensaje-error">
        <strong>❌ Error:</strong> {{ error }}
    </div>
    {% endif %}
    
    <form method="post" action="/login" class="form-container">
        <div class="form-group">
            <label for="username">👤 Usuario:</label>
            <input type="text" id="username" name="username" class="form-input" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="password">🔒 Contraseña:</label>
            <input type="password" id="password" name="password" class="form-input" required>
        </div>
        
        <div class="button-group">
            <button type="submit" class="btn-submit">🚀 Iniciar Sesión</button>
        </div>
    </form>
    
    <div style="margin-top: 20px; text-align: center; padding-top: 20px; border-top: 2px solid #e9ecef;">
        <p style="color: #6c757d;">¿No tienes una cuenta? <a href="/registro" style="color: #667eea; font-weight: bold; text-decoration: none;">📝 Regístrate aquí</a></p>
    </div>
</div>

<style>
    .form-container {
        max-width: 500px;
        margin: 0 auto;
    }
    
    .form-group {
        margin-bottom: 25px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        color: #1e3c72;
        font-size: 1.1em;
    }
    
    .form-input {
        width: 100%;
        padding: 15px;
        border: 2px solid #e9ecef;
        border-radius: 10px;
        font-size: 1em;
        transition: all 0.3s ease;
    }
    
    .form-input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .button-group {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 30px;
    }
    
    .btn-submit {
        padding: 15px 40px;
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 1.1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }
    
    .btn-submit:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }
</style>
{% endblock %}
