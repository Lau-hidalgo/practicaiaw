name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootroot
          MYSQL_DATABASE: webclase_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        cd webclase
        pip install -r requirements.txt

    - name: Run syntax checks
      run: |
        cd webclase
        python -m py_compile main.py
        python -m py_compile data/*.py
        python -m py_compile domain/model/*.py

    - name: Check code style
      run: |
        pip install flake8
        cd webclase
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: |
        docker build -t animales-marinos:${{ github.sha }} .
        docker tag animales-marinos:${{ github.sha }} animales-marinos:latest

    - name: Test Docker image
      run: |
        docker run --rm animales-marinos:latest python -c "import fastapi; print('FastAPI OK')"

  deploy:
    name: Deploy (Production Ready)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deployment notification
      run: |
        echo "✅ Build successful!"
        echo "🚀 Ready to deploy to production"
        echo "📦 Docker image: animales-marinos:${{ github.sha }}"
